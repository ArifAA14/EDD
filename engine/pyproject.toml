[project]
name = "edd"
version = "0.1.0"
description = "Eval-driven development engine: run, judge blind, diff, promote."
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
edd = "edd.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
edd = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
